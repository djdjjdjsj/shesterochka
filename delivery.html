<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доставка – Шестерочка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #ff6b6b;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo {
            max-width: 200px;
            margin-bottom: 15px;
        }
        h1 {
            margin: 0;
            color: white;
            font-size: 2.5em;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="email"], select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
        }
        button:hover {
            background-color: #ff4d4d;
        }
        .message {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://i.ibb.co/Txb0v4V4/278b788f-b57e-45e0-89a5-e01708f1429f.jpg" alt="Логотип Шестерочка" class="logo">
        <h1>Доставка</h1>
    </header>

    <div class="container">
        <h2>Закажите просроченные продукты</h2>
        <form id="orderForm">
            <label for="email">Введите ваш email:</label>
            <input type="email" id="email" required placeholder="example@mail.com">
            
            <label for="product">Выберите продукт:</label>
            <select id="product" required>
                <option value="">--Выберите продукт--</option>
                <option value="просроченный хлеб">Просроченный хлеб</option>
                <option value="просроченное молоко">Просроченное молоко</option>
                <option value="просроченные консервы">Просроченные консервы</option>
                <option value="просроченные сладости">Просроченные сладости</option>
            </select>
            
            <button type="submit">Заказать</button>
        </form>
        <div class="message" id="message"></div>
    </div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const product = document.getElementById('product').value;
            const message = document.getElementById('message');

            if (email && product) {
                message.textContent = `Ожидайте, товар ${product} скоро к вам приедет на ${email}!`;
                document.getElementById('orderForm').reset();
            }
        });
    </script>
</body>
</html>
